<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0b10">
    <meta name="description" content="Beyblade X RPM Counter via ESP32-C3 BLE o USB">
    <title>RPMcounterX</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="glow-bg"></div>
    <div class="app-container">
        <header>
            <div class="logo">RPMcounter<span>X</span></div>
            <div id="status" class="status-pill">DISCONNESSO</div>
        </header>

        <main>
            <section class="gauge-card">
                <div class="gauge-ring">
                    <div class="inner-circle">
                        <div id="rpmValue">0</div>
                        <div class="unit">RPM</div>
                    </div>
                </div>
                <div class="max-box">
                    <span>MAX RPM</span>
                    <strong id="maxValue">0</strong>
                </div>
            </section>

            <div class="connection-buttons">
                <button id="connectBtn" class="btn-neon">📡 BLUETOOTH</button>
                <button id="serialBtn" class="btn-usb">🔌 USB PC</button>
            </div>
            <div id="connectionHint" class="connection-hint">Bluetooth: Chrome/Edge su PC o Android · USB: Chrome/Edge su PC</div>
            <button id="resetBtn" class="btn-reset" disabled>RESET MAX</button>

            <div class="input-card">
                <input type="text" id="noteInput" maxlength="40" placeholder="NOME BEY O NOTA..." autocomplete="off">
                <button id="saveBtn" class="btn-save" disabled>SALVA RECORD</button>
            </div>

            <section class="history-container">
                <div class="section-title">
                    <h3>CRONOLOGIA BATTAGLIE</h3>
                    <span id="recordCount">0</span>
                </div>
                <div id="historyList"></div>
                <div id="emptyHistory" class="empty-history">Nessun record salvato.</div>
            </section>
        </main>

        <footer>
            <button id="exportBtn" class="btn-ghost">ESPORTA</button>
            <button id="clearBtn" class="btn-ghost danger">CANCELLA</button>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
