<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPMcounterX</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="glow-bg"></div>
    <div class="app-container">
        <header>
            <div class="logo">RPMcounterX <span>X</span></div>
            <div id="status" class="status-pill">DISCONNESSO</div>
        </header>

        <main>
            <div class="power-gauge">
                <div class="inner-circle">
                    <div id="rpmValue">0</div>
                    <div class="unit">MAX RPM</div>
                </div>
                <div class="progress-ring"></div>
            </div>

            <button id="connectBtn" class="btn-neon">
                <span>CONNETTI LAUNCHER</span>
            </button>

            <div class="input-card">
                <input type="text" id="noteInput" placeholder="NOME BEY O NOTA...">
                <button id="saveBtn" class="btn-save" disabled>SALVA RECORD</button>
            </div>

            <section class="history-container">
                <h3>CRONOLOGIA BATTAGLIE</h3>
                <div id="historyList"></div>
            </section>
        </main>

        <footer>
            <button id="exportBtn" class="btn-ghost">ESPORTA</button>
            <button id="clearBtn" class="btn-ghost danger">CANCELLA</button>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
